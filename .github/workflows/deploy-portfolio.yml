name: Deploy Portfolio to GitHub Pages

on:
  push:
    branches: ["claude/pokacity-portfolio-site-n1g3n2", "main"]
    paths: ["portfolio/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload portfolio artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: portfolio/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
